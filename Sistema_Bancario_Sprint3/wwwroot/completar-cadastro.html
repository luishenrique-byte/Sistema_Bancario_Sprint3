<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uBank | Ativar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ubank: { light: '#a78bfa', DEFAULT: '#6D28D9', dark: '#4C1D95' } } } }
        }
    </script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -right-[10%] w-[40%] h-[40%] bg-ubank/20 rounded-full blur-[120px]"></div>
    </div>

    <div class="relative w-full max-w-lg my-8">
        <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl text-white">

            <div class="mb-6 flex items-center gap-2 justify-center">
                <i class="fa-solid fa-building-columns text-ubank text-3xl"></i>
                <span class="text-2xl font-bold tracking-wider">uBank<span class="text-ubank">.</span></span>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold">Falta muito pouco!</h2>
                <p class="text-slate-400 mt-2 text-sm">Preencha seus dados para gerarmos sua agência e conta.</p>
            </div>

            <div class="flex p-1 bg-slate-800/50 rounded-xl mb-6">
                <button type="button" id="btn-pf" onclick="mudarTipoPessoa(0)"
                        class="flex-1 py-2 text-sm font-bold rounded-lg bg-ubank text-white shadow transition-all">
                    Para Você (PF)
                </button>
                <button type="button" id="btn-pj" onclick="mudarTipoPessoa(1)"
                        class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all">
                    Para Empresas (PJ)
                </button>
            </div>

            <form id="form-cadastro" onsubmit="salvarDadosCliente(event)" class="space-y-5">

                <div>
                    <label id="label-nome" class="block text-sm font-medium text-slate-400 mb-1">Nome Completo</label>
                    <input type="text" id="nome" required
                           class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-ubank transition"
                           placeholder="Ex: Luis Silva">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label id="label-doc" class="block text-sm font-medium text-slate-400 mb-1">CPF</label>
                        <input type="text" id="cpfCnpj" required
                               class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-ubank transition"
                               placeholder="000.000.000-00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Telefone / WhatsApp</label>
                        <input type="text" id="telefone" required
                               class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-ubank transition"
                               placeholder="(00) 00000-0000">
                    </div>
                </div>

                <div class="p-4 bg-slate-800/30 border border-slate-800 rounded-xl flex items-start gap-3 mt-4">
                    <i class="fa-solid fa-circle-check text-green-400 text-xl mt-0.5"></i>
                    <p class="text-xs text-slate-400 leading-relaxed">
                        Ao prosseguir, sua conta digital <span id="texto-tipo-conta">Pessoa Física</span> será ativada instantaneamente com todos os recursos do uBank.
                    </p>
                </div>

                <button type="submit" id="btn-submit"
                        class="w-full bg-ubank hover:bg-ubank-dark text-white font-bold py-4 rounded-xl shadow-lg shadow-ubank/20 transition-all active:scale-[0.98] mt-2 flex justify-center items-center gap-2">
                    Ativar Minha Conta
                </button>
            </form>
        </div>
    </div>

    <script>
        // Trava de segurança JWT
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        // Lógica de PF e PJ
        let tipoPessoaAtual = 0; // 0 = PF, 1 = PJ (Para bater exatamente com o Enum do C#)

        function mudarTipoPessoa(tipo) {
            tipoPessoaAtual = tipo;
            const btnPf = document.getElementById('btn-pf');
            const btnPj = document.getElementById('btn-pj');
            const labelNome = document.getElementById('label-nome');
            const labelDoc = document.getElementById('label-doc');
            const inputDoc = document.getElementById('cpfCnpj');
            const textoTipoConta = document.getElementById('texto-tipo-conta');

            if (tipo === 0) { // Pessoa Física
                btnPf.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-ubank text-white shadow transition-all";
                btnPj.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all";

                labelNome.innerText = "Nome Completo";
                labelDoc.innerText = "CPF";
                inputDoc.placeholder = "000.000.000-00";
                textoTipoConta.innerText = "Pessoa Física";
            } else { // Pessoa Jurídica
                btnPj.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-ubank text-white shadow transition-all";
                btnPf.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all";

                labelNome.innerText = "Razão Social da Empresa";
                labelDoc.innerText = "CNPJ";
                inputDoc.placeholder = "00.000.000/0001-00";
                textoTipoConta.innerText = "Pessoa Jurídica (Empresarial)";
            }
        }

        async function salvarDadosCliente(event) {
            event.preventDefault();

            // Pega o botão e muda o visual para mostrar que está carregando
            const btnSubmit = document.getElementById('btn-submit');
            const textoBotaoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando...';
            btnSubmit.disabled = true;

            const nome = document.getElementById('nome').value.trim();
            const cpfCnpj = document.getElementById('cpfCnpj').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
             

            // Monta o objeto EXATAMENTE como o C# espera no DTO
            const payload = {
                nome: nome,
                cpfCnpj: cpfCnpj,
                telefone: telefone,
                tipoPessoa: tipoPessoaAtual // Envia 0 ou 1
            };

            try {
                // Chama a rota /api/Clientes (que é a do seu ClientesController)
                const response = await fetch('https://localhost:7044/api/Clientes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Parabéns! Sua conta uBank foi ativada com sucesso.");
                    window.location.href = 'home.html';
                } else {
                    const data = await response.json();
                    console.error("Erro do servidor:", data);

                    // Exibe uma mensagem de erro mais detalhada caso o DTO negue a requisição
                    const msgErro = data.mensagem || JSON.stringify(data.errors) || "Revise os dados e tente novamente.";
                    alert("Erro ao criar conta:\n\n" + msgErro);
                }
            } catch (err) {
                console.error("Erro na requisição:", err);
                alert("Erro ao conectar com o servidor do uBank.");
            } finally {
                // Restaura o botão
                btnSubmit.innerHTML = textoBotaoOriginal;
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
