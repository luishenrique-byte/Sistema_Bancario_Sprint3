<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uBank | Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ubank: { light: '#a78bfa', DEFAULT: '#6D28D9', dark: '#4C1D95' } } } }
        }
    </script>
</head>
<body class="bg-white h-screen flex overflow-hidden">
    <div class="hidden lg:flex w-1/2 bg-ubank p-12 flex-col justify-between relative overflow-hidden">
        <div class="absolute top-0 right-0 w-full h-full opacity-10">
            <i class="fa-solid fa-building-columns text-[400px] -mr-32 -mt-20"></i>
        </div>

        <div class="relative z-10">
            <div class="flex items-center gap-2 mb-12">
                <i class="fa-solid fa-building-columns text-white text-3xl"></i>
                <span class="text-3xl font-bold tracking-wider text-white">uBank<span class="text-purple-300">.</span></span>
            </div>
            <h1 class="text-5xl font-extrabold text-white leading-tight">Comece agora a dominar suas finanças.</h1>
            <p class="text-purple-100 mt-6 text-xl">Leve apenas 2 minutos para abrir sua conta digital 100% gratuita.</p>
        </div>

        <div class="relative z-10 flex gap-8">
            <div class="text-white">
                <p class="text-2xl font-bold">0%</p>
                <p class="text-purple-200 text-sm">Anuidade</p>
            </div>
            <div class="text-white border-l border-purple-400 pl-8">
                <p class="text-2xl font-bold">Limitado</p>
                <p class="text-purple-200 text-sm">Poder de escolha</p>
            </div>
        </div>
    </div>

    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 overflow-y-auto">
        <div class="max-w-md w-full">
            <div class="mb-10 lg:hidden text-center">
                <span class="text-3xl font-bold tracking-wider text-gray-900">uBank<span class="text-ubank">.</span></span>
            </div>

            <h2 class="text-3xl font-bold text-gray-900 mb-2">Abra sua conta</h2>
            <p class="text-gray-500 mb-8">Preencha os dados abaixo para criar seu acesso.</p>

            <form onsubmit="fazerCadastro(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="cad-email" required
                           class="w-full border border-gray-300 rounded-xl py-3 px-4 focus:ring-2 focus:ring-ubank focus:border-transparent transition"
                           placeholder="seu@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Crie uma Senha</label>
                    <input type="password" id="cad-senha" required
                           class="w-full border border-gray-300 rounded-xl py-3 px-4 focus:ring-2 focus:ring-ubank focus:border-transparent transition"
                           placeholder="Mínimo 6 caracteres">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirme a Senha</label>
                    <input type="password" id="cad-senha-conf" required
                           class="w-full border border-gray-300 rounded-xl py-3 px-4 focus:ring-2 focus:ring-ubank focus:border-transparent transition"
                           placeholder="••••••••">
                </div>

                <div class="flex items-start gap-3 py-2">
                    <input type="checkbox" required class="mt-1 w-4 h-4 text-ubank border-gray-300 rounded focus:ring-ubank">
                    <label class="text-xs text-gray-500 leading-relaxed">
                        Li e concordo com os <a href="#" class="text-ubank font-bold">Termos de Uso</a> e a <a href="#" class="text-ubank font-bold">Política de Privacidade</a> do uBank.
                    </label>
                </div>

                <button type="submit"
                        class="w-full bg-ubank hover:bg-ubank-dark text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                    Criar minha conta agora
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-600">
                Já faz parte do uBank? <a href="login.html" class="text-ubank font-bold hover:underline">Faça login</a>
            </p>
        </div>
    </div>

    <script>
        async function fazerCadastro(event) {
            event.preventDefault();
            const email = document.getElementById('cad-email').value;
            const senha = document.getElementById('cad-senha').value;
            const senhaConf = document.getElementById('cad-senha-conf').value;

            if (senha !== senhaConf) {
                alert("As senhas não coincidem!");
                return;
            }

            try {
                // Rota que criamos no AuthController: api/Auth/register
                const response = await fetch('/api/Auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: email, senha: senha })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Conta criada com sucesso! Faça login.");
                    window.location.href = 'login.html';
                } else {
                    alert(data.mensagem || "Erro ao cadastrar.");
                }
            } catch (err) {
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
