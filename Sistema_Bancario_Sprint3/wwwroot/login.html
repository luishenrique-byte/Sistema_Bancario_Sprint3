<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uBank | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ubank: { light: '#a78bfa', DEFAULT: '#6D28D9', dark: '#4C1D95' } } } }
        }
    </script>
</head>
<body class="bg-slate-950 h-screen flex items-center justify-center p-4">
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-ubank/20 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-blue-600/10 rounded-full blur-[120px]"></div>
    </div>

    <div class="relative w-full max-w-md">
        <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 mb-4">
                    <i class="fa-solid fa-building-columns text-ubank text-3xl"></i>
                    <span class="text-2xl font-bold tracking-wider text-white">uBank<span class="text-ubank">.</span></span>
                </a>
                <h2 class="text-xl text-slate-400">Acesse sua conta para continuar</h2>
            </div>

            <form onsubmit="fazerLogin(event)" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">E-mail ou Usuário</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" id="email" required
                               class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-3 px-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-ubank/50 focus:border-ubank transition"
                               placeholder="exemplo@email.com">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-slate-400">Senha</label>
                        <a href="#" class="text-xs text-ubank hover:text-ubank-light transition">Esqueceu a senha?</a>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" id="senha" required
                               class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-3 px-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-ubank/50 focus:border-ubank transition"
                               placeholder="••••••••">
                    </div>
                </div>

                <button type="submit"
                        class="w-full bg-ubank hover:bg-ubank-dark text-white font-bold py-4 rounded-xl shadow-lg shadow-ubank/20 transition-all active:scale-[0.98]">
                    Entrar na Conta
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-800 text-center">
                <p class="text-slate-400 text-sm">
                    Ainda não tem conta?
                    <a href="cadastro.html" class="text-ubank font-bold hover:underline">Abra sua conta grátis</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        async function fazerLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                // Ajuste a porta conforme seu backend
                const response = await fetch('https://localhost:7044/api/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: email, senha: senha })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);

                    //let x = data.precisaCompletarCadastro;
                    //console.log(x);
                    if (data.precisaCompletarCadastro) {
                        alert("Bem-vindo ao uBank! Vamos abrir sua conta agora.")
                        window.location.href = 'completar-cadastro.html';
                    } else {
                        
                        window.location.href = 'home.html';
                    }

                    
                } else {
                    alert(data.mensagem || "Erro ao fazer login");
                }
            } catch (err) {
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
